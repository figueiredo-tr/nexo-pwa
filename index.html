<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071126">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexo">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<title>Nexo</title>
</head>
<body>
<div id="splash" class="splash">
  <img src="assets/nexo-mark.png" alt="" class="splash-mark">
  <div class="splash-title">Nexo</div>
  <div class="splash-sub">Seu centro financeiro</div>
</div>
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand"><img src="assets/nexo-mark.png" alt="Nexo"><div><strong>Nexo</strong><small id="statusLine">Família · Local</small></div></div>
    <button id="syncBtn" class="icon-btn" aria-label="Sincronizar"><img src="assets/icons/arrow-left-right.svg" alt=""></button>
  </header>
  <main id="content"></main>
  <nav class="bottom-nav" aria-label="Navegação principal">
    <button data-tab="home" class="active"><img src="assets/icons/house.svg" alt=""><span>Visão</span></button>
    <button data-tab="moves"><img src="assets/icons/arrow-left-right.svg" alt=""><span>Movimentos</span></button>
    <button data-tab="uber"><img src="assets/icons/car-front.svg" alt=""><span>Uber</span></button>
    <button data-tab="assistant"><img src="assets/icons/bot.svg" alt=""><span>Assistente</span></button>
    <button data-tab="more"><img src="assets/icons/settings.svg" alt=""><span>Mais</span></button>
  </nav>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
